name: Java dependency verification
on:
  pull_request:
    paths: ['src/SmartHotel.Services.Tasks/**', 'src/SmartHotel.Services.Reviews/**', 'scripts/JdbcSecurityCheck.java', 'scripts/verify_java_services.py', '.github/workflows/java-security.yml']
  push:
    branches: [master]
    paths: ['src/SmartHotel.Services.Tasks/**', 'src/SmartHotel.Services.Reviews/**', 'scripts/JdbcSecurityCheck.java', 'scripts/verify_java_services.py', '.github/workflows/java-security.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '8'
      - name: Build both services with their Maven wrappers
        run: |
          for service in Tasks Reviews; do
            (cd "src/SmartHotel.Services.$service" && bash mvnw -B clean verify)
          done
      - name: Check JDBC parameter security against isolated PostgreSQL
        run: |
          driver="$HOME/.m2/repository/org/postgresql/postgresql/42.2.28/postgresql-42.2.28.jar"
          javac -cp "$driver" -d "$RUNNER_TEMP" scripts/JdbcSecurityCheck.java
          java -cp "$RUNNER_TEMP:$driver" JdbcSecurityCheck
      - name: Prepare disposable service databases and browser
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -c 'CREATE DATABASE tasks'
          psql -h 127.0.0.1 -U postgres -c 'CREATE DATABASE reviews'
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Verify service and Swagger compatibility
        run: python scripts/verify_java_services.py
